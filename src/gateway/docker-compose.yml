version: '3.8'

services:
  # Upstream Validating DNSSEC Resolver (Unbound)
  unbound-resolver:
    image: mvance/unbound:latest
    container_name: aiori_dnssec_resolver
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped

  # Authenticated Gateway Proxy Engine
  gateway-proxy:
    build: .
    container_name: aiori_gateway_proxy
    ports:
      - "8530:8530"
    environment:
      - UPSTREAM_RESOLVER=unbound-resolver
    depends_on:
      - unbound-resolver
    restart: unless-stopped